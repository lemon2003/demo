<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户注册</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <div class="card w-50 mx-auto">
        <div class="card-body">
            <h3 class="card-title text-center">用户注册</h3>
            <form id="registerForm">
                <div class="mb-3">
                    <label class="form-label">用户名</label>
                    <input type="text" class="form-control" name="username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">邮箱</label>
                    <input type="email" class="form-control" name="email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">密码</label>
                    <input type="password" class="form-control" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">注册</button>
            </form>
            <div id="message" class="mt-3 text-center"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('registerForm');
        const message = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            const userData = {
                username: formData.get('username'),
                email: formData.get('email'),
                password: formData.get('password') // 实际项目需加密，这里仅示例
            };

            try {
                // 调用 Cloudflare Workers 接口（替换成你的接口地址）
                const res = await fetch('https://green-water-4275.927367539.workers.dev/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });

                const data = await res.json();
                if (res.ok) {
                    message.textContent = '注册成功！';
                    message.className = 'mt-3 text-center text-success';
                    form.reset();
                } else {
                    message.textContent = `注册失败：${data.error}`;
                    message.className = 'mt-3 text-center text-danger';
                }
            } catch (err) {
                message.textContent = '网络错误，请重试';
                message.className = 'mt-3 text-center text-danger';
            }
        });
    </script>
</body>
</html>
