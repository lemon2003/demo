<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>用户注册登录</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .form-card { max-width: 500px; margin: 50px auto; }
    .tab-content { padding: 20px 0; }
    .alert { margin-top: 15px; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card form-card">
      <div class="card-header">
        <ul class="nav nav-tabs card-header-tabs">
          <li class="nav-item">
            <a class="nav-link active" data-bs-toggle="tab" href="#register">注册</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" data-bs-toggle="tab" href="#login">登录</a>
          </li>
        </ul>
      </div>
      <div class="card-body">
        <div class="tab-content">
          <!-- 注册表单 -->
          <div class="tab-pane fade show active" id="register">
            <h5 class="card-title text-center mb-4">用户注册</h5>
            <form id="registerForm">
              <div class="mb-3">
                <label class="form-label">姓名</label>
                <input type="text" class="form-control" name="name" placeholder="请输入姓名" required>
              </div>
              <div class="mb-3">
                <label class="form-label">手机号</label>
                <input type="tel" class="form-control" name="phone" placeholder="请输入11位手机号" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">提交注册</button>
            </form>
            <div id="registerAlert" class="alert"></div>
          </div>

          <!-- 登录表单 -->
          <div class="tab-pane fade" id="login">
            <h5 class="card-title text-center mb-4">用户登录</h5>
            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label">姓名</label>
                <input type="text" class="form-control" name="name" placeholder="请输入注册姓名" required>
              </div>
              <div class="mb-3">
                <label class="form-label">手机号</label>
                <input type="tel" class="form-control" name="phone" placeholder="请输入注册手机号" required>
              </div>
              <button type="submit" class="btn btn-success w-100">登录</button>
            </form>
            <div id="loginAlert" class="alert"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // 替换为你的 Vercel 域名
    const VERCEL_DOMAIN = 'https://demo-eosin-mu.vercel.app';

    // 注册表单处理
    const registerForm = document.getElementById('registerForm');
    const registerAlert = document.getElementById('registerAlert');
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(registerForm);
      const userData = {
        name: formData.get('name'),
        phone: formData.get('phone')
      };

      try {
        const res = await fetch(`${VERCEL_DOMAIN}/api/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(userData)
        });
        const data = await res.json();

        registerAlert.style.display = 'block';
        if (res.ok) {
          registerAlert.className = 'alert alert-success';
          registerAlert.textContent = data.message;
          registerForm.reset();
        } else {
          registerAlert.className = 'alert alert-danger';
          registerAlert.textContent = data.error;
        }
      } catch (err) {
        registerAlert.style.display = 'block';
        registerAlert.className = 'alert alert-danger';
        registerAlert.textContent = '网络错误，请重试';
      }
    });

    // 登录表单处理
    const loginForm = document.getElementById('loginForm');
    const loginAlert = document.getElementById('loginAlert');
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(loginForm);
      const userData = {
        name: formData.get('name'),
        phone: formData.get('phone')
      };

      try {
        const res = await fetch(`${VERCEL_DOMAIN}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(userData)
        });
        const data = await res.json();

        loginAlert.style.display = 'block';
        if (res.ok) {
          loginAlert.className = 'alert alert-success';
          loginAlert.textContent = `${data.message}，欢迎 ${data.user.name}！`;
          loginForm.reset();
        } else {
          loginAlert.className = 'alert alert-danger';
          loginAlert.textContent = data.error;
        }
      } catch (err) {
        loginAlert.style.display = 'block';
        loginAlert.className = 'alert alert-danger';
        loginAlert.textContent = '网络错误，请重试';
      }
    });
  </script>
</body>
</html>
