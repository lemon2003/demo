<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>用户注册登录</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- 引入 Supabase 客户端 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4/dist/umd/supabase.min.js"></script>
  <style>
    /* 基础样式保留 */
    .form-card { max-width: 500px; margin: 50px auto; }
    .tab-content { padding: 20px 0; }
    .alert { margin-top: 15px; display: none; }

    /* ========== 新增：横屏适配核心样式 ========== */
    /* 全局重置，确保适配全屏 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      height: 100%;
      overflow-x: hidden;
    }

    /* 手机横屏提示层（默认隐藏） */
    .landscape-tip {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #333;
      color: white;
      font-size: 18px;
      text-align: center;
      padding-top: 50vh;
      transform: translateY(-50%);
      z-index: 9999;
    }

    /* 手机端强制横屏容器适配 */
    .mobile-landscape-container {
      width: 100vh;  /* 宽度取屏幕高度 */
      height: 100vw; /* 高度取屏幕宽度 */
      transform: rotate(90deg) translateY(-100%);
      transform-origin: top left;
      position: fixed;
      top: 0;
      left: 0;
      overflow: auto;
      padding: 20px 0;
    }

    /* 平板/电脑适配（不做横屏处理） */
    @media (min-width: 768px) {
      .form-card {
        max-width: 500px;
        margin: 50px auto;
      }
    }
  </style>
</head>
<body>
  <!-- ========== 新增：横屏提示层 ========== -->
  <div class="landscape-tip">请将手机横屏使用本页面</div>

  <!-- 原有容器包裹到适配容器中 -->
  <div class="main-container container">
    <div class="card form-card">
      <div class="card-header">
        <ul class="nav nav-tabs card-header-tabs">
          <li class="nav-item">
            <a class="nav-link active" data-bs-toggle="tab" href="#register">注册</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" data-bs-toggle="tab" href="#login">登录</a>
          </li>
        </ul>
      </div>
      <div class="card-body">
        <div class="tab-content">
          <!-- 注册表单 -->
          <div class="tab-pane fade show active" id="register">
            <h5 class="card-title text-center mb-4">用户注册</h5>
            <form id="registerForm">
              <div class="mb-3">
                <label class="form-label">姓名</label>
                <input type="text" class="form-control" name="name" placeholder="请输入姓名" required>
              </div>
              <div class="mb-3">
                <label class="form-label">手机号</label>
                <input type="tel" class="form-control" name="phone" placeholder="请输入11位手机号" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">提交注册</button>
            </form>
            <div id="registerAlert" class="alert"></div>
          </div>

          <!-- 登录表单 -->
          <div class="tab-pane fade" id="login">
            <h5 class="card-title text-center mb-4">用户登录</h5>
            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label">姓名</label>
                <input type="text" class="form-control" name="name" placeholder="请输入注册姓名" required>
              </div>
              <div class="mb-3">
                <label class="form-label">手机号</label>
                <input type="tel" class="form-control" name="phone" placeholder="请输入注册手机号" required>
              </div>
              <button type="submit" class="btn btn-success w-100">登录</button>
            </form>
            <div id="loginAlert" class="alert"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // ========== 新增：设备判断与横屏适配逻辑 ==========
    // 1. 判断是否为手机（排除平板）
    function isMobileDevice() {
      return /Mobile|Android|iPhone|iPod/i.test(navigator.userAgent) 
             && !/iPad|Tablet/i.test(navigator.userAgent);
    }

    // 2. 检测屏幕方向并适配
    function checkOrientation() {
      const tip = document.querySelector('.landscape-tip');
      const mainContainer = document.querySelector('.main-container');
      
      // 手机端处理
      if (isMobileDevice()) {
        // 竖屏时显示提示，横屏时适配布局
        if (window.innerWidth < window.innerHeight) {
          tip.style.display = 'block';
          mainContainer.classList.remove('mobile-landscape-container');
        } else {
          tip.style.display = 'none';
          mainContainer.classList.add('mobile-landscape-container');
        }
      } else {
        // 电脑/平板：正常显示，不处理横屏
        tip.style.display = 'none';
        mainContainer.classList.remove('mobile-landscape-container');
      }
    }

    // 3. 监听屏幕变化事件
    window.addEventListener('load', checkOrientation);
    window.addEventListener('resize', checkOrientation);
    window.addEventListener('orientationchange', checkOrientation);

    // --------------------------
    // 原有 Supabase 初始化和业务逻辑（完全保留）
    // --------------------------
    const SUPABASE_URL = 'https://ndtbgmwwapapnvvggfuj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kdGJnbXd3YXBhcG52dmdnZnVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAyMDQ4MTMsImV4cCI6MjA4NTc4MDgxM30.u6yqUQW4xF3cEo72kII1Y36dfm1RZxenOemsDrV2p34';

    // 正确初始化（先定义变量）
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      global: {
        fetch: (url, options = {}) => {
          options.credentials = 'omit';
          return fetch(url, options);
        }
      }
    });

    // 注册逻辑
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const name = form.name.value.trim();
      const phone = form.phone.value.trim();
      const alertEl = document.getElementById('registerAlert');

      // 手机号校验
      if (!/^1[3-9]\d{9}$/.test(phone)) {
        alertEl.className = 'alert alert-danger';
        alertEl.textContent = '请输入有效的11位手机号';
        alertEl.style.display = 'block';
        return;
      }

      try {
        // 插入数据（字段名已匹配英文name/phone）
        const { data, error } = await supabase
          .from('user_info')
          .insert([{ name, phone }])
          .select();

        if (error) {
          alertEl.className = 'alert alert-danger';
          alertEl.textContent = error.message.includes('unique constraint') 
            ? '该手机号已注册' 
            : `注册失败：${error.message}`;
          alertEl.style.display = 'block';
          return;
        }

        // 注册成功
        alertEl.className = 'alert alert-success';
        alertEl.textContent = '注册成功！';
        alertEl.style.display = 'block';
        form.reset();
      } catch (err) {
        alertEl.className = 'alert alert-danger';
        alertEl.textContent = `网络错误：${err.message}`;
        alertEl.style.display = 'block';
      }
    });

    // 登录逻辑
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const name = form.name.value.trim();
      const phone = form.phone.value.trim();
      const alertEl = document.getElementById('loginAlert');

      try {
        // 查询数据（字段名匹配）
        const { data, error } = await supabase
          .from('user_info')
          .select('*')
          .eq('phone', phone)
          .eq('name', name)
          .single();

        if (error) {
          alertEl.className = 'alert alert-danger';
          alertEl.textContent = error.code === 'PGRST116' 
            ? '姓名或手机号错误' 
            : `登录失败：${error.message}`;
          alertEl.style.display = 'block';
          return;
        }

        // 登录成功
        alertEl.className = 'alert alert-success';
        alertEl.textContent = `登录成功！欢迎 ${data.name}`;
        alertEl.style.display = 'block';
        form.reset();
      } catch (err) {
        alertEl.className = 'alert alert-danger';
        alertEl.textContent = `网络错误：${err.message}`;
        alertEl.style.display = 'block';
      }
    });
  </script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/vcd15cbe7772f49c399c6a5babf22c1241717689176015" integrity="sha512-ZpsOmlRQV6y907TI0dKBHq9Md29nnaEIPlkf84rnaERnq6zvWvPUqr2ft8M1aS28oN72PdrCzSjY4U6VaAw1EQ==" data-cf-beacon='{"version":"2024.11.0","token":"0d390eaa32dc4bf9a297f31d3850d355","r":1,"server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
