<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>用户注册登录</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    .form-card { max-width: 500px; margin: 50px auto; }
    .tab-content { padding: 20px 0; }
    .alert { margin-top: 15px; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card form-card">
      <div class="card-header">
        <ul class="nav nav-tabs card-header-tabs">
          <li class="nav-item">
            <a class="nav-link active" data-bs-toggle="tab" href="#register">注册</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" data-bs-toggle="tab" href="#login">登录</a>
          </li>
        </ul>
      </div>
      <div class="card-body">
        <div class="tab-content">
          <!-- 注册表单 -->
          <div class="tab-pane fade show active" id="register">
            <h5 class="card-title text-center mb-4">用户注册</h5>
            <form id="registerForm">
              <div class="mb-3">
                <label class="form-label">姓名</label>
                <input type="text" class="form-control" name="name" placeholder="请输入姓名" required>
              </div>
              <div class="mb-3">
                <label class="form-label">手机号</label>
                <input type="tel" class="form-control" name="phone" placeholder="请输入11位手机号" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">提交注册</button>
            </form>
            <div id="registerAlert" class="alert"></div>
          </div>

          <!-- 登录表单 -->
          <div class="tab-pane fade" id="login">
            <h5 class="card-title text-center mb-4">用户登录</h5>
            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label">姓名</label>
                <input type="text" class="form-control" name="name" placeholder="请输入注册姓名" required>
              </div>
              <div class="mb-3">
                <label class="form-label">手机号</label>
                <input type="tel" class="form-control" name="phone" placeholder="请输入注册手机号" required>
              </div>
              <button type="submit" class="btn btn-success w-100">登录</button>
            </form>
            <div id="loginAlert" class="alert"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // 替换为你的 Supabase 信息
    const SUPABASE_URL = 'https://ndtbgmwwapapnvvggfuj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_y4LZyy2ez2483QKHS-4EnA_bNuQTp5O';

    // 初始化 Supabase 客户端
    const supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 注册表单处理
    const registerForm = document.getElementById('registerForm');
    const registerAlert = document.getElementById('registerAlert');
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(registerForm);
      const userData = {
        name: formData.get('name'),
        phone: formData.get('phone')
      };

      try {
        // 手机号校验
        const phoneReg = /^1[3-9]\d{9}$/;
        if (!phoneReg.test(userData.phone)) {
          registerAlert.style.display = 'block';
          registerAlert.className = 'alert alert-danger';
          registerAlert.textContent = '请输入有效的手机号';
          return;
        }

        // 直接写入 Supabase
        const { data, error } = await supabase
          .from('user_info')
          .insert([userData])
          .select();

        if (error) {
          if (error.message.includes('unique constraint')) {
            registerAlert.style.display = 'block';
            registerAlert.className = 'alert alert-danger';
            registerAlert.textContent = '该手机号已注册';
            return;
          }
          throw error;
        }

        registerAlert.style.display = 'block';
        registerAlert.className = 'alert alert-success';
        registerAlert.textContent = '注册成功';
        registerForm.reset();
      } catch (err) {
        registerAlert.style.display = 'block';
        registerAlert.className = 'alert alert-danger';
        registerAlert.textContent = `注册失败：${err.message}`;
      }
    });

    // 登录表单处理
    const loginForm = document.getElementById('loginForm');
    const loginAlert = document.getElementById('loginAlert');
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(loginForm);
      const userData = {
        name: formData.get('name'),
        phone: formData.get('phone')
      };

      try {
        // 直接查询 Supabase
        const { data, error } = await supabase
          .from('user_info')
          .select('*')
          .eq('phone', userData.phone)
          .eq('name', userData.name)
          .single();

        if (error) {
          if (error.code === 'PGRST116') {
            loginAlert.style.display = 'block';
            loginAlert.className = 'alert alert-danger';
            loginAlert.textContent = '姓名或电话错误，登录失败';
            return;
          }
          throw error;
        }

        loginAlert.style.display = 'block';
        loginAlert.className = 'alert alert-success';
        loginAlert.textContent = `登录成功，欢迎 ${data.name}！`;
        loginForm.reset();
      } catch (err) {
        loginAlert.style.display = 'block';
        loginAlert.className = 'alert alert-danger';
        loginAlert.textContent = `登录失败：${err.message}`;
      }
    });
  </script>
</body>
</html>
